<rect x="280" y="40" width="120" height="44" rx="8" stroke-width="0.5" class="box-purple"/>
<text x="340" y="65" text-anchor="middle" class="th txt-purple">KDC</text>

<rect x="520" y="40" width="120" height="44" rx="8" stroke-width="0.5" class="box-teal"/>
<text x="580" y="65" text-anchor="middle" class="th txt-teal">Service</text>

<line x1="160" y1="62" x2="272" y2="62" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="400" y1="56" x2="512" y2="56" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="512" y1="68" x2="400" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="120" width="290" height="80" rx="8" stroke-width="0.5" class="box-red"/>
<text x="60" y="145" class="th txt-red">AS-REP Roasting</text>
