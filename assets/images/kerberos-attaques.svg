<rect x="60" y="375" width="20" height="20" rx="4" stroke-width="0.5" class="box-red"/>
<text x="90" y="389" class="ts txt-gray">AS-REP Roasting · pas besoin d'être authentifié</text>

<rect x="60" y="402" width="20" height="20" rx="4" stroke-width="0.5" class="box-amber"/>
