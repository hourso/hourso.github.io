<text x="60" y="265" class="ts txt-coral-s">Cible : hash de krbtgt</text>
<text x="60" y="283" class="ts txt-coral-s">Forge n'importe quel TGT</text>

<rect x="350" y="220" width="290" height="80" rx="8" stroke-width="0.5" class="box-pink"/>
