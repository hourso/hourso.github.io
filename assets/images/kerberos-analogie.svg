<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<style>
.t { font-size: 14px; }
.ts { font-size: 12px; }
.th { font-size: 14px; font-weight: 500; }
.box-purple { fill: #EEEDFE; stroke: #534AB7; }
.box-blue { fill: #E6F1FB; stroke: #185FA5; }
.box-gray { fill: #F1EFE8; stroke: #5F5E5A; }
.txt-purple { fill: #26215C; }
.txt-purple-s { fill: #534AB7; }
.txt-blue { fill: #042C53; }
.txt-blue-s { fill: #185FA5; }
.txt-gray { fill: #2C2C2A; }
</style>

<text x="170" y="30" text-anchor="middle" class="th txt-purple">Parc d'attractions</text>
<text x="510" y="30" text-anchor="middle" class="th txt-blue">Kerberos</text>

<line x1="340" y1="20" x2="340" y2="395" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>

<rect x="40" y="55" width="260" height="56" rx="8" stroke-width="0.5" class="box-purple"/>
<text x="170" y="80" text-anchor="middle" class="th txt-purple">Caisse du parc</text>
<text x="170" y="98" text-anchor="middle" class="ts txt-purple-s">Tu paies l'entrée → bracelet</text>

<rect x="380" y="55" width="260" height="56" rx="8" stroke-width="0.5" class="box-blue"/>
<text x="510" y="80" text-anchor="middle" class="th txt-blue">AS (Authentication Service)</text>
<text x="510" y="98" text-anchor="middle" class="ts txt-blue-s">Mot de passe → TGT</text>

<rect x="40" y="135" width="260" height="56" rx="8" stroke-width="0.5" class="box-purple"/>
<text x="170" y="160" text-anchor="middle" class="th txt-purple">Bracelet du parc</text>
<text x="170" y="178" text-anchor="middle" class="ts txt-purple-s">Prouve que tu as payé</text>

<rect x="380" y="135" width="260" height="56" rx="8" stroke-width="0.5" class="box-blue"/>
<text x="510" y="160" text-anchor="middle" class="th txt-blue">TGT</text>
<text x="510" y="178" text-anchor="middle" class="ts txt-blue-s">Ticket Granting Ticket</text>

<rect x="40" y="215" width="260" height="56" rx="8" stroke-width="0.5" class="box-purple"/>
<text x="170" y="240" text-anchor="middle" class="th txt-purple">Guichet d'attraction</text>
<text x="170" y="258" text-anchor="middle" class="ts txt-purple-s">Bracelet → ticket spécifique</text>

<rect x="380" y="215" width="260" height="56" rx="8" stroke-width="0.5" class="box-blue"/>
<text x="510" y="240" text-anchor="middle" class="th txt-blue">TGS (Ticket Granting Service)</text>
<text x="510" y="258" text-anchor="middle" class="ts txt-blue-s">TGT → ticket de service</text>

<rect x="40" y="295" width="260" height="56" rx="8" stroke-width="0.5" class="box-purple"/>
<text x="170" y="320" text-anchor="middle" class="th txt-purple">Opérateur du grand huit</text>
<text x="170" y="338" text-anchor="middle" class="ts txt-purple-s">Vérifie ton ticket → tu montes</text>

<rect x="380" y="295" width="260" height="56" rx="8" stroke-width="0.5" class="box-blue"/>
<text x="510" y="320" text-anchor="middle" class="th txt-blue">Service applicatif</text>
<text x="510" y="338" text-anchor="middle" class="ts txt-blue-s">Vérifie le ticket → accès</text>

<rect x="40" y="375" width="600" height="30" rx="6" stroke-width="0.5" class="box-gray"/>
<text x="340" y="393" text-anchor="middle" class="ts txt-gray">Idée centrale : tu paies (mot de passe) une seule fois, ensuite tout se fait avec des tickets</text>
</svg>
