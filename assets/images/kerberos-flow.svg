<text x="570" y="73" text-anchor="middle" class="ts txt-teal-s">Serveur de fichiers</text>

<line x1="110" y1="86" x2="110" y2="510" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="340" y1="86" x2="340" y2="510" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="570" y1="86" x2="570" y2="510" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>

<rect x="40" y="110" width="180" height="22" rx="4" stroke-width="0.5" class="box-blue"/>
<text x="130" y="125" text-anchor="middle" class="ts">1. AS-REQ (preauth)</text>
<line x1="220" y1="121" x2="332" y2="121" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="160" y="148" width="180" height="22" rx="4" stroke-width="0.5" class="box-purple"/>
<text x="250" y="163" text-anchor="middle" class="ts txt-purple-s">2. AS-REP (TGT)</text>
<line x1="332" y1="159" x2="118" y2="159" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arrow)"/>

<text x="340" y="195" text-anchor="middle" class="tg">Authentification initiale → TGT obtenu</text>
<line x1="60" y1="208" x2="620" y2="208" stroke="#B4B2A9" stroke-width="0.5"/>

<rect x="40" y="225" width="200" height="22" rx="4" stroke-width="0.5" class="box-blue"/>
