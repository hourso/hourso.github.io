<line x1="240" y1="236" x2="332" y2="236" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="160" y="263" width="200" height="22" rx="4" stroke-width="0.5" class="box-purple"/>
<text x="260" y="278" text-anchor="middle" class="ts txt-purple-s">4. TGS-REP (ticket service)</text>
<line x1="332" y1="274" x2="118" y2="274" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arrow)"/>

<text x="340" y="310" text-anchor="middle" class="tg">Demande de ticket pour un service précis</text>
<line x1="60" y1="323" x2="620" y2="323" stroke="#B4B2A9" stroke-width="0.5"/>

<rect x="40" y="340" width="200" height="22" rx="4" stroke-width="0.5" class="box-blue"/>
<text x="140" y="355" text-anchor="middle" class="ts">5. AP-REQ (ticket service)</text>
<line x1="240" y1="351" x2="562" y2="351" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="380" y="378" width="200" height="22" rx="4" stroke-width="0.5" class="box-teal"/>
<text x="480" y="393" text-anchor="middle" class="ts txt-teal-s">6. AP-REP (accès accordé)</text>
<line x1="562" y1="389" x2="118" y2="389" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arrow)"/>

<text x="340" y="425" text-anchor="middle" class="tg">Présentation du ticket au service → accès</text>

<rect x="40" y="455" width="600" height="60" rx="8" stroke-width="0.5" class="box-gray"/>
<text x="60" y="480" class="th txt-gray">Points clés</text>
<text x="60" y="500" class="ts txt-gray">Le mot de passe ne transite jamais. TGT chiffré avec krbtgt. Tickets de service chiffrés avec le hash du compte service.</text>
</svg>
