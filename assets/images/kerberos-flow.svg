<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
.t { font-size: 14px; fill: #042C53; }
.ts { font-size: 12px; fill: #185FA5; }
.th { font-size: 14px; font-weight: 500; fill: #042C53; }
.tg { font-size: 12px; fill: #5F5E5A; }
.box-blue { fill: #E6F1FB; stroke: #185FA5; }
.box-purple { fill: #EEEDFE; stroke: #534AB7; }
.box-teal { fill: #E1F5EE; stroke: #0F6E56; }
.box-gray { fill: #F1EFE8; stroke: #5F5E5A; }
.txt-purple { fill: #26215C; }
.txt-purple-s { fill: #534AB7; }
.txt-teal { fill: #04342C; }
.txt-teal-s { fill: #0F6E56; }
.txt-gray { fill: #2C2C2A; }
</style>

<rect x="40" y="30" width="140" height="56" rx="8" stroke-width="0.5" class="box-blue"/>
<text x="110" y="55" text-anchor="middle" class="th">Client</text>
<text x="110" y="73" text-anchor="middle" class="ts">Alice (poste de travail)</text>

<rect x="270" y="30" width="140" height="56" rx="8" stroke-width="0.5" class="box-purple"/>
<text x="340" y="55" text-anchor="middle" class="th txt-purple">KDC</text>
<text x="340" y="73" text-anchor="middle" class="ts txt-purple-s">Contrôleur de domaine</text>

<rect x="500" y="30" width="140" height="56" rx="8" stroke-width="0.5" class="box-teal"/>
